{% extends "panel/base.html" %}

{% block title %}Novo Membro — {{ restaurant.name }}{% endblock %}
{% block page_title %}Novo Membro{% endblock %}
{% block page_subtitle %}Cadastre um cozinheiro ou gerente{% endblock %}

{% block panel_content %}

<div class="max-w-md">
  <form method="POST" action="{% url 'panel_team_create' restaurant.slug %}">
    {% csrf_token %}

    <div class="bg-white rounded-xl border border-gray-200 p-6 space-y-4">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nome</label>
        <input type="text" name="name" required autofocus
               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-900 bg-white focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20"
               placeholder="Nome completo">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" name="email" required
               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-900 bg-white focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20"
               placeholder="email@exemplo.com">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
        <input type="password" name="password" required
               class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-900 bg-white focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20"
               placeholder="Mínimo 8 caracteres">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Função</label>
        <select name="role"
                class="w-full px-4 py-2.5 border border-gray-200 rounded-lg text-sm text-gray-900 bg-white focus:outline-none focus:border-green-500 focus:ring-2 focus:ring-green-500/20">
          <option value="kitchen">👨‍🍳 Cozinha — acessa só o painel da cozinha</option>
          <option value="manager">⚙️ Gerente — acessa o painel administrativo</option>
        </select>
      </div>

    </div>

    <div class="flex gap-3 mt-4">
      <button type="submit"
              class="bg-green-700 hover:bg-green-600 text-white font-semibold px-6 py-2.5 rounded-lg text-sm transition-all">
        Criar Membro
      </button>
      <a href="{% url 'panel_team' restaurant.slug %}"
         class="bg-white hover:bg-gray-50 text-gray-700 font-semibold px-6 py-2.5 rounded-lg text-sm border border-gray-200 transition-all">
        Cancelar
      </a>
    </div>

  </form>
</div>

{% endblock %}
