{% extends "base.html" %}

{% block title %}Entrar — Servd{% endblock %}

{% block content %}
<div class="min-h-screen bg-canvas flex items-center justify-center px-4 py-16">
  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="text-center mb-10">
      <div class="w-16 h-16 bg-brand/10 border border-brand/20 rounded-2xl flex items-center justify-center mx-auto mb-6">
        <span class="text-3xl" role="img" aria-label="Prato">🍽️</span>
      </div>
      <h1 class="text-2xl font-bold text-white">Servd</h1>
      <p class="text-zinc-500 text-sm mt-1">Painel de Gestão</p>
    </div>

    <!-- Formulário -->
    <div class="card p-8">

      {% if error %}
        <div role="alert" class="bg-danger/10 border border-danger/20 text-red-400 text-sm rounded-xl px-4 py-3 mb-6 flex items-start gap-3">
          <span class="flex-shrink-0">⚠️</span>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="POST" action="/auth/login/" novalidate>
        {% csrf_token %}

        <div class="mb-5">
          <label for="email" class="block text-sm font-medium text-zinc-300 mb-2">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autofocus
            autocomplete="email"
            placeholder="seu@email.com"
            class="field">
        </div>

        <div class="mb-8">
          <label for="password" class="block text-sm font-medium text-zinc-300 mb-2">Senha</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            placeholder="••••••••"
            class="field">
        </div>

        <button type="submit" class="btn-primary w-full h-12 text-sm">
          Entrar na conta
        </button>

      </form>
    </div>

    <p class="text-center text-zinc-700 text-xs mt-8">Servd · Sistema de Pedidos Digital</p>

  </div>
</div>
{% endblock %}
